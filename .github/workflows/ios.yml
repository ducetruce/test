name: iOS CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain and project
        run: |
          xcodebuild -version
          xcodebuild -project OpenRing.xcodeproj -list

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenRing.xcodeproj \
            -scheme OpenRing \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/OpenRingDerivedData" \
            CODE_SIGNING_ALLOWED=NO
