name: Build and test

# macOS runners bill at a 10x minute multiplier on private repos, so this is scoped
# tightly: one branch, superseded runs cancelled, and a hard timeout.
on:
  push:
    branches: [ "claude/ios-oura-app-clone-xafabh" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and project sanity
        run: |
          sw_vers
          xcodebuild -version
          echo "--- targets, configurations and schemes ---"
          xcodebuild -list -project OpenRing.xcodeproj

      # Simulator names drift between runner images, so pick whatever iPhone this
      # image actually has rather than hard-coding a model that may vanish.
      - name: Choose a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              # Runtime keys look like com.apple.CoreSimulator.SimRuntime.iOS-18-2
              version = runtime.rsplit('iOS-', 1)[-1].replace('-', '.')
              try:
                  key = tuple(int(part) for part in version.split('.'))
              except ValueError:
                  key = (0,)
              for device in devices:
                  if not device.get('isAvailable'):
                      continue
                  if 'iPhone' not in device.get('name', ''):
                      continue
                  if best is None or key > best[0]:
                      best = (key, device['udid'], device['name'], version)
          if best is None:
              sys.exit('No available iPhone simulator on this runner')
          print(best[1])
          sys.stderr.write(f'Using {best[2]} (iOS {best[3]})\n')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator $UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenRing.xcodeproj \
            -scheme OpenRing \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log

      # Artifact downloads are not always reachable, so the diagnosis has to live in the
      # job log itself — and near the end of it, where a tail will find it.
      - name: Failure summary
        if: failure()
        run: |
          echo "===================== COMPILE ERRORS ====================="
          grep -E "error:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | sort -u | head -60 || true
          echo "===================== BUILD FAILURES ====================="
          grep -E "^\*\* .* \*\*|The following build commands failed|Command .* failed" xcodebuild.log | sort -u | head -20 || true
          echo "===================== TEST FAILURES ======================"
          grep -E "Test Case .* (failed|error)|XCTAssert.* failed|Failing tests:|^\s+-\[.*\]$" xcodebuild.log | head -60 || true
          echo "===================== WARNING SAMPLE ====================="
          grep -E "warning:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | sort -u | head -25 || true
          echo "=========================================================="

      # The raw log is what makes a failed run diagnosable after the fact.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
