name: Build and test

# macOS runners bill at a 10x minute multiplier on private repos, so this is scoped
# tightly: one branch, superseded runs cancelled, and a hard timeout.
on:
  push:
    branches: [ "claude/ios-oura-app-clone-xafabh" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and project sanity
        run: |
          xcodebuild -version
          xcodebuild -list -project OpenRing.xcodeproj

      # Simulator names drift between runner images, so pick whatever iPhone this
      # image actually has rather than hard-coding a model that may vanish.
      - name: Choose a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              version = runtime.rsplit('iOS-', 1)[-1].replace('-', '.')
              try:
                  key = tuple(int(part) for part in version.split('.'))
              except ValueError:
                  key = (0,)
              for device in devices:
                  if not device.get('isAvailable') or 'iPhone' not in device.get('name', ''):
                      continue
                  if best is None or key > best[0]:
                      best = (key, device['udid'], device['name'], version)
          if best is None:
              sys.exit('No available iPhone simulator on this runner')
          print(best[1])
          sys.stderr.write(f'Using {best[2]} (iOS {best[3]})\n')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # continue-on-error so the summary below always runs and is the LAST thing in the
      # job log: artifact downloads redirect to blob storage that is not always reachable,
      # so the log tail has to carry the whole diagnosis.
      - name: Build and test
        id: xcb
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenRing.xcodeproj \
            -scheme OpenRing \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild.log 2>&1

      - name: Summary
        run: |
          if [ "${{ steps.xcb.outcome }}" = "success" ]; then
            echo "===================== TESTS PASSED ====================="
            grep -cE "^Test Case .* passed" xcodebuild.log | sed 's/^/passing test cases: /' || true
            grep -E "warning:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | sort -u | head -20 || true
            echo "======================================================="
            exit 0
          fi
          echo "===================== COMPILE ERRORS ====================="
          grep -E "error:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | sort -u | head -60 || true
          echo "===================== BUILD FAILURES ====================="
          grep -E "^\*\* .* \*\*|The following build commands failed|Command .* failed" xcodebuild.log | sort -u | head -20 || true
          echo "===================== TEST FAILURES ======================"
          grep -E "Test Case .* failed|XCTAssert.* failed|failed - |Failing tests:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | head -50 || true
          echo "===================== WARNINGS ==========================="
          grep -E "warning:" xcodebuild.log | sed 's|/Users/runner/work/test/test/||' | sort -u | head -20 || true
          echo "=========================================================="
          exit 1
