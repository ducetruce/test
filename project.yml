# Fallback project definition. If the checked-in OpenRing.xcodeproj ever goes stale,
# `brew install xcodegen && xcodegen generate` rebuilds it from this file.
name: OpenRing
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenRing:
    type: application
    platform: iOS
    sources:
      - OpenRing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openring
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OpenRingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenRingTests
    dependencies:
      - target: OpenRing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openring.tests
        GENERATE_INFOPLIST_FILE: "YES"
